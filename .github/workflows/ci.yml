name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowsEasyEmoji.sln

      - name: Test
        run: dotnet test WindowsEasyEmoji.sln --configuration Release --no-restore

      - name: Build
        run: dotnet build WindowsEasyEmoji.sln --configuration Release --no-restore
